name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # allows manual triggering

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          IMAGE_NAME=your-dockerhub-ochogwuprince/messaging-app
          TAG_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          TAG_BRANCH=${GITHUB_REF##*/}
          docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:$TAG_BRANCH -t $IMAGE_NAME:$TAG_SHA ./messaging_app

      - name: Push Docker image
        run: |
          IMAGE_NAME=your-dockerhub-ochogwuprince/messaging-app
          TAG_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          TAG_BRANCH=${GITHUB_REF##*/}
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$TAG_BRANCH
          docker push $IMAGE_NAME:$TAG_SHA
